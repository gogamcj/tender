[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bid-analyzer-backend"
version = "0.1.0"
description = "대한민국 공공입찰 통합 분석 및 투찰금액 추천 시스템 - 백엔드"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "xlrd>=2.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "xlwt>=1.3", "reportlab>=4.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`", "ignore:ast.NameConstant is deprecated:DeprecationWarning"]
